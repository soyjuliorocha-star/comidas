name: Comidas
options:
  bundleIdPrefix: com.comidaslog
   objectVersion: 56
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    GENERATE_INFOPLIST_FILE: NO
    SUPPORTS_MACCATALYST: NO
targets:
  Comidas:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comidaslog.app
        PRODUCT_NAME: Comidas
schemes:
  Comidas:
    build:
      targets:
        Comidas: all
