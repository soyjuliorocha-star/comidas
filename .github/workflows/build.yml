name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Compilar
        run: |
          echo "::error::--- listado de Sources ---"
          ls -R Sources | while IFS= read -r l; do echo "::error::$l"; done
          echo "::error::--- xcodebuild -list ---"
          xcodebuild -list -project Comidas.xcodeproj 2>&1 | while IFS= read -r l; do echo "::error::$l"; done
          set +e
          xcodebuild -project Comidas.xcodeproj -target Comidas \
            -sdk iphoneos -configuration Release \
            SYMROOT="$PWD/out" OBJROOT="$PWD/obj" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::--- salida $code, ultimas 30 lineas ---"
            tail -n 30 build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
          fi
      - name: Empaquetar
        run: |
          mkdir -p Payload
          cp -R out/Release-iphoneos/Comidas.app Payload/
          zip -qr Comidas.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Comidas-ipa
          path: Comidas.ipa
