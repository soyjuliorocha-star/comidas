name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen 2.38
        run: |
          curl -sL -o x.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          unzip -q x.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen --version
      - run: xcodegen generate
      - name: Compilar
        run: |
          set +e
          xcodebuild -project Comidas.xcodeproj -target Comidas \
            -sdk iphoneos -configuration Release \
            SYMROOT="$PWD/out" OBJROOT="$PWD/obj" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -n 30 build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
          fi
      - name: Empaquetar
        run: |
          mkdir -p Payload
          cp -R out/Release-iphoneos/Comidas.app Payload/
          zip -qr Comidas.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Comidas-ipa
          path: Comidas.ipa
