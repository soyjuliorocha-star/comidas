name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Diagnostico
        run: |
          xcodebuild -version
          xcodebuild -list -project Comidas.xcodeproj || true
          ls -R Sources
      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild -project Comidas.xcodeproj -target Comidas \
            -sdk iphoneos -configuration Release \
            SYMROOT="$PWD/out" OBJROOT="$PWD/obj" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log | tail -n 100
      - name: Empaquetar
        run: |
          mkdir -p Payload
          cp -R out/Release-iphoneos/Comidas.app Payload/
          zip -qr Comidas.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Comidas-ipa
          path: Comidas.ipa
